<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neguá · Recibimos sus datos</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo-blanco.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100svh;background:#17130F;color:#E7DFD1;font-family:'Jost',sans-serif;font-weight:300;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
  body::before{content:"";position:absolute;inset:0;background:url(assets/noche.jpg) center/cover;opacity:.35}
  body::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(23,19,15,.2),#17130F 75%)}
  main{position:relative;z-index:2;max-width:560px}
  img{height:44px;margin:0 auto 40px;filter:drop-shadow(0 0 12px rgba(255,196,120,.75)) drop-shadow(0 0 34px rgba(255,170,90,.4))}
  h1{font-family:'Comfortaa';font-weight:600;font-size:clamp(30px,5vw,46px);color:#fff;margin-bottom:18px;line-height:1.15}
  p{font-size:18px;color:#DCC8AF;margin-bottom:32px}
  a{color:#E7DFD1;font-weight:400;font-size:14px;letter-spacing:.06em;text-underline-offset:6px;text-decoration-color:#A48C72}
</style>
</head>
<body>
<main>
  <img src="assets/logo-blanco.png" alt="Neguá">
  <h1>Listo. Recibimos sus datos.</h1>
  <p>Revisamos su perfil y le escribimos a su correo o WhatsApp. Gracias por querer encender su fuego con nosotros.</p>
  <a href="/">Volver a la página</a>
</main>
</body>
</html>
